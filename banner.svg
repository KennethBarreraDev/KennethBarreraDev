<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Ultra-Deep Space Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#091128" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Moving Volumetric Auroras -->
    <radialGradient id="orbBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.48" />
      <stop offset="55%" stop-color="#1D4ED8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.34" />
      <stop offset="55%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Animated Shimmer Gradient for Title -->
    <linearGradient id="titleShimmer" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#FFFFFF" />
      <animate attributeName="x1" values="-100%;100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="5s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="w1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.52" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.38" />
    </linearGradient>

    <linearGradient id="w2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="w3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Top Laser Beam -->
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Tech Grid -->
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>

    <clipPath id="clip">
      <rect width="1200" height="320" rx="22" />
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Base & Grid -->
    <rect width="1200" height="320" fill="url(#bg)" />
    <rect width="1200" height="320" fill="url(#grid)" />

    <!-- Animated Volumetric Auroras -->
    <circle cx="320" cy="110" r="300" fill="url(#orbBlue)">
      <animate attributeName="cx" values="260;580;260" dur="11s" repeatCount="indefinite" />
      <animate attributeName="cy" values="90;170;90" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="880" cy="140" r="270" fill="url(#orbCyan)">
      <animate attributeName="cx" values="940;620;940" dur="13s" repeatCount="indefinite" />
      <animate attributeName="cy" values="170;80;170" dur="10s" repeatCount="indefinite" />
    </circle>

    <!-- Top Animated Laser Scan -->
    <rect x="-400" y="0" width="400" height="3" fill="url(#laser)">
      <animate attributeName="x" from="-400" to="1200" dur="3.8s" repeatCount="indefinite" />
    </rect>

    <!-- Subtle Orbiting Rings (Left & Right) -->
    <g opacity="0.25">
      <circle cx="140" cy="145" r="58" fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="8 8">
        <animateTransform attributeName="transform" type="rotate" from="0 140 145" to="360 140 145" dur="22s" repeatCount="indefinite" />
      </circle>
      <circle cx="1060" cy="145" r="64" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="10 10">
        <animateTransform attributeName="transform" type="rotate" from="360 1060 145" to="0 1060 145" dur="26s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Rising Glowing Particles -->
    <circle cx="110" cy="220" r="2.2" fill="#38BDF8">
      <animate attributeName="cy" values="250;50;250" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;0" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="290" cy="200" r="1.8" fill="#60A5FA">
      <animate attributeName="cy" values="240;40;240" dur="7.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.85;0" dur="7.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="910" cy="210" r="2.4" fill="#38BDF8">
      <animate attributeName="cy" values="260;45;260" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;0" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="1095" cy="190" r="2" fill="#818CF8">
      <animate attributeName="cy" values="240;55;240" dur="8.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.85;0" dur="8.2s" repeatCount="indefinite" />
    </circle>

    <!-- Triple Animated Liquid Waves -->
    <path fill="url(#w1)">
      <animate attributeName="d" dur="9.5s" repeatCount="indefinite"
        values="
          M0,242 C220,202 460,282 720,238 C940,198 1090,268 1200,234 L1200,320 L0,320 Z;
          M0,232 C200,276 480,196 740,242 C960,276 1100,206 1200,246 L1200,320 L0,320 Z;
          M0,242 C220,202 460,282 720,238 C940,198 1090,268 1200,234 L1200,320 L0,320 Z" />
    </path>
    <path fill="url(#w2)">
      <animate attributeName="d" dur="6.5s" repeatCount="indefinite"
        values="
          M0,266 C280,300 520,222 800,262 C1000,292 1120,242 1200,262 L1200,320 L0,320 Z;
          M0,258 C260,222 540,295 820,252 C1020,226 1130,286 1200,266 L1200,320 L0,320 Z;
          M0,266 C280,300 520,222 800,262 C1000,292 1120,242 1200,262 L1200,320 L0,320 Z" />
    </path>
    <path fill="url(#w3)">
      <animate attributeName="d" dur="5s" repeatCount="indefinite"
        values="
          M0,284 C280,258 540,310 820,280 C1020,258 1130,296 1200,282 L1200,320 L0,320 Z;
          M0,280 C260,308 560,258 840,286 C1030,304 1140,262 1200,286 L1200,320 L0,320 Z;
          M0,284 C280,258 540,310 820,280 C1020,258 1130,296 1200,282 L1200,320 L0,320 Z" />
    </path>

    <!-- CENTERED CLEAN HERO CONTENT (No Terminal Box) -->
    <!-- Top Pill -->
    <g transform="translate(490, 38)">
      <rect x="0" y="0" width="220" height="28" rx="14" fill="#09090B" fill-opacity="0.72" stroke="#2563EB" stroke-width="1" stroke-opacity="0.75" />
      <circle cx="18" cy="14" r="4" fill="#38BDF8">
        <animate attributeName="r" values="2.8;5.4;2.8" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="120" y="18.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#BAE6FD" letter-spacing="1.5">SOFTWARE ENGINEER • MX</text>
    </g>

    <!-- Main Shimmering Name -->
    <text x="600" y="138" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="url(#titleShimmer)" letter-spacing="-1.2">Kenneth Barrera</text>

    <!-- Role Line -->
    <text x="600" y="180" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="url(#blueGrad)" letter-spacing="0.8">Full-Stack Software Engineer</text>

    <!-- Animated Centered Accent Bar -->
    <rect x="520" y="194" width="160" height="3" rx="1.5" fill="url(#blueGrad)">
      <animate attributeName="width" values="110;240;110" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x" values="545;480;545" dur="5s" repeatCount="indefinite" />
    </rect>

    <!-- Clean Centered Tech Pills -->
    <g transform="translate(341, 214)" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="600">
      <rect x="0" y="0" width="82" height="28" rx="8" fill="#090D16" fill-opacity="0.85" stroke="#1E3A8A" stroke-width="1" />
      <text x="41" y="18.5" text-anchor="middle" fill="#60A5FA">Flutter</text>

      <rect x="92" y="0" width="76" height="28" rx="8" fill="#090D16" fill-opacity="0.85" stroke="#1E3A8A" stroke-width="1" />
      <text x="130" y="18.5" text-anchor="middle" fill="#60A5FA">Kotlin</text>

      <rect x="178" y="0" width="72" height="28" rx="8" fill="#090D16" fill-opacity="0.85" stroke="#1E3A8A" stroke-width="1" />
      <text x="214" y="18.5" text-anchor="middle" fill="#38BDF8">React</text>

      <rect x="260" y="0" width="84" height="28" rx="8" fill="#090D16" fill-opacity="0.85" stroke="#1E3A8A" stroke-width="1" />
      <text x="302" y="18.5" text-anchor="middle" fill="#38BDF8">Node.js</text>

      <rect x="354" y="0" width="60" height="28" rx="8" fill="#090D16" fill-opacity="0.85" stroke="#1E3A8A" stroke-width="1" />
      <text x="384" y="18.5" text-anchor="middle" fill="#93C5FD">SQL</text>

      <rect x="424" y="0" width="94" height="28" rx="8" fill="#090D16" fill-opacity="0.85" stroke="#1E3A8A" stroke-width="1" />
      <text x="471" y="18.5" text-anchor="middle" fill="#93C5FD">Firebase</text>
    </g>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="#1D4ED8" stroke-width="1.5" stroke-opacity="0.65" />
</svg>
