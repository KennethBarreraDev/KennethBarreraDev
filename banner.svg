<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Deep Space to Midnight Blue Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0A1128" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Animated Aurora Glows -->
    <radialGradient id="aurora1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.42" />
      <stop offset="60%" stop-color="#1D4ED8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="aurora2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Liquid Wave Gradients -->
    <linearGradient id="waveBack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="waveMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="waveFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.35" />
    </linearGradient>

    <!-- Animated Shimmer Text Gradient -->
    <linearGradient id="shimmer" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Neon Pulse Line -->
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>

    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.65" stroke-opacity="0.45" />
    </pattern>

    <clipPath id="cardClip">
      <rect width="1200" height="320" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base & Grid -->
    <rect width="1200" height="320" fill="url(#bg)" />
    <rect width="1200" height="320" fill="url(#techGrid)" />

    <!-- Moving Aurora Orbs -->
    <circle cx="300" cy="110" r="280" fill="url(#aurora1)">
      <animate attributeName="cx" values="250;550;250" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="90;150;90" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="900" cy="140" r="260" fill="url(#aurora2)">
      <animate attributeName="cx" values="950;650;950" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="160;80;160" dur="9s" repeatCount="indefinite" />
    </circle>

    <!-- Floating Animated Stars / Nodes -->
    <circle cx="110" cy="70" r="2.2" fill="#60A5FA">
      <animate attributeName="cy" values="70;52;70" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="240" cy="175" r="1.8" fill="#38BDF8">
      <animate attributeName="cy" values="175;155;175" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="960" cy="60" r="2.6" fill="#38BDF8">
      <animate attributeName="cy" values="60;80;60" dur="4.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1090" cy="150" r="2" fill="#60A5FA">
      <animate attributeName="cy" values="150;130;150" dur="5.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="820" cy="195" r="1.8" fill="#93C5FD">
      <animate attributeName="cy" values="195;178;195" dur="4.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.4s" repeatCount="indefinite" />
    </circle>

    <!-- Orbiting Decorative Rings (Left & Right) -->
    <g opacity="0.28">
      <circle cx="135" cy="145" r="56" fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="8 8">
        <animateTransform attributeName="transform" type="rotate" from="0 135 145" to="360 135 145" dur="22s" repeatCount="indefinite" />
      </circle>
      <circle cx="1065" cy="145" r="64" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="10 10">
        <animateTransform attributeName="transform" type="rotate" from="360 1065 145" to="0 1065 145" dur="26s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Top Laser Beam Scan -->
    <rect x="-360" y="0" width="360" height="3" fill="url(#beam)">
      <animate attributeName="x" from="-360" to="1200" dur="3.8s" repeatCount="indefinite" />
    </rect>

    <!-- Triple Layered Liquid Waves -->
    <path fill="url(#waveBack)">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="
          M0,240 C220,200 420,285 660,240 C880,195 1060,270 1200,235 L1200,320 L0,320 Z;
          M0,230 C200,275 440,195 680,235 C900,275 1080,205 1200,245 L1200,320 L0,320 Z;
          M0,240 C220,200 420,285 660,240 C880,195 1060,270 1200,235 L1200,320 L0,320 Z" />
    </path>

    <path fill="url(#waveMid)">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="
          M0,262 C260,300 500,220 760,260 C980,295 1110,238 1200,258 L1200,320 L0,320 Z;
          M0,255 C240,220 520,295 780,250 C1000,220 1120,285 1200,262 L1200,320 L0,320 Z;
          M0,262 C260,300 500,220 760,260 C980,295 1110,238 1200,258 L1200,320 L0,320 Z" />
    </path>

    <path fill="url(#waveFront)">
      <animate attributeName="d" dur="5.2s" repeatCount="indefinite"
        values="
          M0,282 C280,255 540,310 820,278 C1020,255 1130,295 1200,280 L1200,320 L0,320 Z;
          M0,278 C260,308 560,255 840,285 C1030,305 1140,260 1200,284 L1200,320 L0,320 Z;
          M0,282 C280,255 540,310 820,278 C1020,255 1130,295 1200,280 L1200,320 L0,320 Z" />
    </path>

    <!-- Live Status Pill -->
    <g transform="translate(460, 40)">
      <rect x="0" y="0" width="280" height="30" rx="15" fill="#09090B" fill-opacity="0.72" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.65" />
      <circle cx="20" cy="15" r="4.5" fill="#38BDF8">
        <animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="150" y="19.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#BAE6FD" letter-spacing="1.6">AVAILABLE FOR PROJECTS • MX</text>
    </g>

    <!-- Glowing Main Name -->
    <text x="600" y="142" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="-1.2">KENNETH BARRERA</text>

    <!-- Animated Shimmer Role -->
    <text x="600" y="186" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="url(#shimmer)" letter-spacing="1.2">FULL-STACK SOFTWARE ENGINEER</text>

    <!-- Clean Stack Bar -->
    <text x="600" y="222" text-anchor="middle" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="500" fill="#CBD5E1">
      Flutter  •  Kotlin  •  React  •  Node.js  •  SQL  •  Firebase  |  Spring Boot  •  React Native
    </text>
  </g>

  <!-- Crisp Glass Border -->
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#1D4ED8" stroke-width="1.5" stroke-opacity="0.65" />
</svg>
