<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <radialGradient id="topGlow" cx="50%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <pattern id="subtleGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" rx="16" fill="url(#bg)" />
  <rect width="1200" height="280" rx="16" fill="url(#subtleGrid)" />
  <rect width="1200" height="280" rx="16" fill="url(#topGlow)" />

  <!-- Subtle Border -->
  <rect x="1" y="1" width="1198" height="278" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- Top Center Pill -->
  <g transform="translate(470, 44)">
    <rect x="0" y="0" width="260" height="28" rx="14" fill="#0F172A" stroke="#1E3A8A" stroke-width="1" />
    <circle cx="18" cy="14" r="4" fill="#3B82F6" />
    <text x="140" y="18.5" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#93C5FD" letter-spacing="1.4">AVAILABLE FOR PROJECTS • MX</text>
  </g>

  <!-- Main Name -->
  <text x="600" y="142" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="800" fill="#F8FAFC" letter-spacing="-1">Kenneth Barrera</text>

  <!-- Role Subtitle -->
  <text x="600" y="184" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="url(#blueAccent)" letter-spacing="0.4">Full-Stack Software Engineer</text>

  <!-- Tech Line -->
  <text x="600" y="224" text-anchor="middle" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="500" fill="#94A3B8">
    Flutter • Kotlin • React • Node.js • SQL • Firebase  |  Spring Boot • React Native
  </text>

  <!-- Bottom Accent Bar -->
  <rect x="440" y="276" width="320" height="4" rx="2" fill="url(#blueAccent)" />
</svg>
