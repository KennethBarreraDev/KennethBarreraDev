<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Ultra-Deep Space Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#091128" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Moving Volumetric Glows -->
    <radialGradient id="orbBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.5" />
      <stop offset="55%" stop-color="#1D4ED8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#0284C7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Animated Shimmer Gradient for Title & Role -->
    <linearGradient id="titleShimmer" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#FFFFFF" />
      <animate attributeName="x1" values="-100%;100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="5s" repeatCount="indefinite" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.62" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0.88" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="w1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.52" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.38" />
    </linearGradient>

    <linearGradient id="w2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.45" />
    </linearGradient>

    <!-- Laser Beam -->
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>

    <!-- Perspective Grid Pattern -->
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>

    <clipPath id="clip">
      <rect width="1200" height="360" rx="22" />
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Base & Grid -->
    <rect width="1200" height="360" fill="url(#bg)" />
    <rect width="1200" height="360" fill="url(#grid)" />

    <!-- Animated Volumetric Auroras -->
    <circle cx="260" cy="120" r="320" fill="url(#orbBlue)">
      <animate attributeName="cx" values="200;480;200" dur="11s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;190;100" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="940" cy="180" r="290" fill="url(#orbCyan)">
      <animate attributeName="cx" values="980;700;980" dur="13s" repeatCount="indefinite" />
      <animate attributeName="cy" values="200;90;200" dur="10s" repeatCount="indefinite" />
    </circle>

    <!-- Top & Bottom Animated Laser Scans -->
    <rect x="-400" y="0" width="400" height="3" fill="url(#laser)">
      <animate attributeName="x" from="-400" to="1200" dur="3.6s" repeatCount="indefinite" />
    </rect>

    <!-- Rising Glowing Particles -->
    <circle cx="90" cy="240" r="2.2" fill="#38BDF8">
      <animate attributeName="cy" values="270;60;270" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;0" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="340" cy="220" r="1.8" fill="#60A5FA">
      <animate attributeName="cy" values="260;40;260" dur="7.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.85;0" dur="7.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="620" cy="250" r="2.4" fill="#38BDF8">
      <animate attributeName="cy" values="290;50;290" dur="10.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;0" dur="10.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1140" cy="200" r="2" fill="#818CF8">
      <animate attributeName="cy" values="260;55;260" dur="8.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.85;0" dur="8.2s" repeatCount="indefinite" />
    </circle>

    <!-- Animated Liquid Waves at Bottom -->
    <path fill="url(#w1)">
      <animate attributeName="d" dur="9s" repeatCount="indefinite"
        values="
          M0,280 C220,240 460,320 720,275 C940,235 1090,305 1200,270 L1200,360 L0,360 Z;
          M0,270 C200,315 480,235 740,280 C960,315 1100,245 1200,285 L1200,360 L0,360 Z;
          M0,280 C220,240 460,320 720,275 C940,235 1090,305 1200,270 L1200,360 L0,360 Z" />
    </path>
    <path fill="url(#w2)">
      <animate attributeName="d" dur="6s" repeatCount="indefinite"
        values="
          M0,305 C280,340 520,260 800,300 C1000,330 1120,280 1200,300 L1200,360 L0,360 Z;
          M0,298 C260,260 540,335 820,290 C1020,265 1130,325 1200,305 L1200,360 L0,360 Z;
          M0,305 C280,340 520,260 800,300 C1000,330 1120,280 1200,300 L1200,360 L0,360 Z" />
    </path>

    <!-- LEFT SIDE: Identity & High-Impact Typography -->
    <g transform="translate(65, 58)">
      <!-- Live Status Badge -->
      <rect x="0" y="0" width="268" height="30" rx="15" fill="#09090B" fill-opacity="0.75" stroke="#2563EB" stroke-width="1" stroke-opacity="0.8" />
      <circle cx="19" cy="15" r="4.5" fill="#38BDF8">
        <animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="19.5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#BAE6FD" letter-spacing="1.4">AVAILABLE FOR PROJECTS • MX</text>

      <!-- Main Shimmering Name -->
      <text x="0" y="96" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="900" fill="url(#titleShimmer)" letter-spacing="-1.2">Kenneth Barrera</text>

      <!-- Role Line -->
      <text x="2" y="138" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="url(#blueGrad)" letter-spacing="0.4">Full-Stack Software Engineer</text>

      <!-- Animated Accent Underline -->
      <rect x="2" y="152" width="120" height="3.5" rx="1.75" fill="url(#blueGrad)">
        <animate attributeName="width" values="90;240;90" dur="5s" repeatCount="indefinite" />
      </rect>

      <!-- Clean Tech Pills -->
      <g transform="translate(0, 178)" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="600">
        <rect x="0" y="0" width="82" height="28" rx="8" fill="#0F172A" stroke="#1E3A8A" stroke-width="1" />
        <text x="41" y="18.5" text-anchor="middle" fill="#60A5FA">Flutter</text>

        <rect x="92" y="0" width="76" height="28" rx="8" fill="#0F172A" stroke="#1E3A8A" stroke-width="1" />
        <text x="130" y="18.5" text-anchor="middle" fill="#60A5FA">Kotlin</text>

        <rect x="178" y="0" width="72" height="28" rx="8" fill="#0F172A" stroke="#1E3A8A" stroke-width="1" />
        <text x="214" y="18.5" text-anchor="middle" fill="#38BDF8">React</text>

        <rect x="260" y="0" width="84" height="28" rx="8" fill="#0F172A" stroke="#1E3A8A" stroke-width="1" />
        <text x="302" y="18.5" text-anchor="middle" fill="#38BDF8">Node.js</text>

        <rect x="354" y="0" width="60" height="28" rx="8" fill="#0F172A" stroke="#1E3A8A" stroke-width="1" />
        <text x="384" y="18.5" text-anchor="middle" fill="#93C5FD">SQL</text>

        <rect x="424" y="0" width="94" height="28" rx="8" fill="#0F172A" stroke="#1E3A8A" stroke-width="1" />
        <text x="471" y="18.5" text-anchor="middle" fill="#93C5FD">Firebase</text>
      </g>
    </g>

    <!-- RIGHT SIDE: Floating Glassmorphic Live Terminal Card -->
    <g transform="translate(715, 48)">
      <animateTransform attributeName="transform" type="translate" values="715,48; 715,38; 715,48" dur="5.5s" repeatCount="indefinite" />

      <!-- Orbiting Ring Behind Card -->
      <circle cx="380" cy="40" r="55" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="6 6" opacity="0.35">
        <animateTransform attributeName="transform" type="rotate" from="0 380 40" to="360 380 40" dur="18s" repeatCount="indefinite" />
      </circle>

      <!-- Card Body -->
      <rect x="0" y="0" width="420" height="224" rx="16" fill="url(#glassCard)" stroke="#2563EB" stroke-width="1.2" stroke-opacity="0.65" />

      <!-- Terminal Top Bar -->
      <path d="M 0 16 Q 0 0 16 0 L 404 0 Q 420 0 420 16 L 420 36 L 0 36 Z" fill="#090D16" fill-opacity="0.9" />
      <circle cx="20" cy="18" r="5" fill="#EF4444" />
      <circle cx="38" cy="18" r="5" fill="#F59E0B" />
      <circle cx="56" cy="18" r="5" fill="#10B981" />
      <text x="210" y="22" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-size="11.5" fill="#64748B">kenneth@fullstack — zsh</text>

      <!-- Terminal Content -->
      <g transform="translate(22, 62)" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="13">
        <text x="0" y="0" fill="#38BDF8">$ <tspan fill="#E2E8F0">whoami --stack</tspan></text>
        <text x="0" y="26" fill="#94A3B8">role:    <tspan fill="#FFFFFF">"Full-Stack Engineer"</tspan></text>
        <text x="0" y="50" fill="#94A3B8">mobile:  <tspan fill="#60A5FA">["Flutter", "Kotlin"]</tspan></text>
        <text x="0" y="74" fill="#94A3B8">web:     <tspan fill="#38BDF8">["React", "Node.js"]</tspan></text>
        <text x="0" y="98" fill="#94A3B8">data:    <tspan fill="#93C5FD">["SQL", "Firebase"]</tspan></text>
        <text x="0" y="122" fill="#94A3B8">next:    <tspan fill="#818CF8">["Spring Boot", "RN"]</tspan></text>
        <text x="0" y="146" fill="#38BDF8">$ <tspan fill="#10B981">shipping</tspan> <tspan fill="#E2E8F0">production...</tspan></text>
        <!-- Blinking Cursor -->
        <rect x="208" y="135" width="8" height="14" fill="#38BDF8">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#1D4ED8" stroke-width="1.5" stroke-opacity="0.65" />
</svg>
