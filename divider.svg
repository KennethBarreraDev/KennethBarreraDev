<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" width="100%" height="12">
  <defs>
    <linearGradient id="divLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09090B" stop-opacity="0" />
      <stop offset="25%" stop-color="#1E3A8A" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="75%" stop-color="#1E3A8A" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="0" y="5" width="1200" height="2" rx="1" fill="url(#divLine)" />
  <rect x="-240" y="4.5" width="240" height="3" rx="1.5" fill="url(#pulse)">
    <animate attributeName="x" from="-240" to="1200" dur="3.5s" repeatCount="indefinite" />
  </rect>
</svg>
