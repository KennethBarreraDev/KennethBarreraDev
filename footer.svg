    <text x="600" y="72" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F8FAFC" letter-spacing="0.8">Kenneth Barrera  •  Full-Stack Software Engineer  •  Built to Scale</text>
