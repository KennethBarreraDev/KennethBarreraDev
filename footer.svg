          M0,55 C280,30 580,85 880,50 C1060,30 1150,70 1200,55 L1200,110 L0,110 Z;
          M0,60 C300,90 560,30 860,60 C1040,80 1140,45 1200,60 L1200,110 L0,110 Z" />
