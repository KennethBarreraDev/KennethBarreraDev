<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 175" width="100%" height="100%">
  <defs>
    <linearGradient id="lBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="1184" height="158" rx="18" fill="url(#lBg)" stroke="#1E3A8A" stroke-width="1.3" stroke-opacity="0.7" />

  <!-- Header Badge -->
  <g transform="translate(42, 32)">
    <circle cx="8" cy="10" r="4.5" fill="#38BDF8">
      <animate attributeName="r" values="3;5.5;3" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="22" y="14.5" font-family="'Fira Code', Consolas, monospace" font-size="13" font-weight="700" fill="#38BDF8" letter-spacing="1.6">CURRENTLY EXPANDING INTO</text>
    <text x="275" y="14.5" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" fill="#64748B">— Leveling up enterprise backend &amp; cross-platform ecosystems</text>
  </g>

  <!-- Track 1: Spring Boot & Java -->
  <g transform="translate(42, 74)">
    <text x="0" y="16" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">🍃 Spring Boot &amp; Java</text>
    <text x="530" y="16" text-anchor="end" font-family="'Fira Code', Consolas, monospace" font-size="12" font-weight="600" fill="#38BDF8">IN PROGRESS</text>
    <rect x="0" y="28" width="530" height="10" rx="5" fill="#0F172A" stroke="#1E293B" />
    <rect x="0" y="28" width="380" height="10" rx="5" fill="url(#bar1)">
      <animate attributeName="width" values="350;410;350" dur="4.5s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="58" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12.5" fill="#94A3B8">Microservices, Spring Security, JPA/Hibernate &amp; Enterprise REST APIs</text>
  </g>

  <!-- Track 2: React Native -->
  <g transform="translate(628, 74)">
    <text x="0" y="16" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">⚛️ React Native</text>
    <text x="530" y="16" text-anchor="end" font-family="'Fira Code', Consolas, monospace" font-size="12" font-weight="600" fill="#818CF8">IN PROGRESS</text>
    <rect x="0" y="28" width="530" height="10" rx="5" fill="#0F172A" stroke="#1E293B" />
    <rect x="0" y="28" width="360" height="10" rx="5" fill="url(#bar2)">
      <animate attributeName="width" values="330;395;330" dur="5s" repeatCount="indefinite" />
    </rect>
    <text x="0" y="58" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12.5" fill="#94A3B8">Native modules, Expo ecosystem, shared TypeScript architecture &amp; animations</text>
  </g>
</svg>
