<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 225" width="100%" height="100%">
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <radialGradient id="topBlue" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- CARD 1: FULL-STACK WEB -->
  <g transform="translate(8, 8)">
    <rect width="376" height="208" rx="16" fill="url(#cBg)" stroke="#1E293B" stroke-width="1.3" />
    <rect width="376" height="208" rx="16" fill="url(#topBlue)" />
    <rect x="24" y="0" width="90" height="3" rx="1.5" fill="url(#accent1)">
      <animate attributeName="width" values="70;140;70" dur="4.2s" repeatCount="indefinite" />
    </rect>

    <!-- Icon Badge -->
    <rect x="24" y="24" width="44" height="44" rx="12" fill="#0F172A" stroke="#1D4ED8" stroke-width="1" />
    <text x="46" y="53" text-anchor="middle" font-size="22">🌐</text>

    <text x="82" y="44" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">Full-Stack Web</text>
    <text x="82" y="63" font-family="'Fira Code', Consolas, monospace" font-size="11" font-weight="600" fill="#38BDF8">FRONTEND &amp; API SYSTEMS</text>

    <text x="24" y="102" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13.5" fill="#94A3B8">High-speed React applications paired with</text>
    <text x="24" y="122" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13.5" fill="#94A3B8">scalable Node.js &amp; Express architectures.</text>

    <!-- Pills -->
    <g transform="translate(24, 152)" font-family="'Fira Code', Consolas, monospace" font-size="11.5" font-weight="600">
      <rect x="0" y="0" width="64" height="26" rx="7" fill="#0F172A" stroke="#1E3A8A" />
      <text x="32" y="17" text-anchor="middle" fill="#38BDF8">React</text>

      <rect x="72" y="0" width="94" height="26" rx="7" fill="#0F172A" stroke="#1E3A8A" />
      <text x="119" y="17" text-anchor="middle" fill="#60A5FA">TypeScript</text>

      <rect x="174" y="0" width="76" height="26" rx="7" fill="#0F172A" stroke="#1E3A8A" />
      <text x="212" y="17" text-anchor="middle" fill="#93C5FD">Node.js</text>

      <rect x="258" y="0" width="70" height="26" rx="7" fill="#0F172A" stroke="#1E3A8A" />
      <text x="293" y="17" text-anchor="middle" fill="#CBD5E1">REST</text>
    </g>
  </g>

  <!-- CARD 2: MOBILE ENGINEERING -->
  <g transform="translate(412, 8)">
    <rect width="376" height="208" rx="16" fill="url(#cBg)" stroke="#1E293B" stroke-width="1.3" />
    <rect width="376" height="208" rx="16" fill="url(#topBlue)" />
    <rect x="24" y="0" width="90" height="3" rx="1.5" fill="url(#accent2)">
      <animate attributeName="width" values="140;70;140" dur="4.8s" repeatCount="indefinite" />
    </rect>

    <!-- Icon Badge -->
    <rect x="24" y="24" width="44" height="44" rx="12" fill="#0F172A" stroke="#3B82F6" stroke-width="1" />
    <text x="46" y="53" text-anchor="middle" font-size="22">📱</text>

    <text x="82" y="44" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">Mobile Engineering</text>
    <text x="82" y="63" font-family="'Fira Code', Consolas, monospace" font-size="11" font-weight="600" fill="#60A5FA">CROSS-PLATFORM &amp; NATIVE</text>

    <text x="24" y="102" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13.5" fill="#94A3B8">Fluid 60/120fps apps in Flutter &amp; native</text>
    <text x="24" y="122" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13.5" fill="#94A3B8">Kotlin built with Clean Architecture.</text>

    <!-- Pills -->
    <g transform="translate(24, 152)" font-family="'Fira Code', Consolas, monospace" font-size="11.5" font-weight="600">
      <rect x="0" y="0" width="76" height="26" rx="7" fill="#0F172A" stroke="#1E3A8A" />
      <text x="38" y="17" text-anchor="middle" fill="#38BDF8">Flutter</text>

      <rect x="84" y="0" width="68" height="26" rx="7" fill="#0F172A" stroke="#1E3A8A" />
      <text x="118" y="17" text-anchor="middle" fill="#818CF8">Kotlin</text>

      <rect x="160" y="0" width="58" height="26" rx="7" fill="#0F172A" stroke="#1E3A8A" />
      <text x="189" y="17" text-anchor="middle" fill="#60A5FA">Dart</text>

      <rect x="226" y="0" width="78" height="26" rx="7" fill="#0F172A" stroke="#1E3A8A" />
      <text x="265" y="17" text-anchor="middle" fill="#93C5FD">Android</text>
    </g>
  </g>

  <!-- CARD 3: DATA & CLOUD -->
  <g transform="translate(816, 8)">
    <rect width="376" height="208" rx="16" fill="url(#cBg)" stroke="#1E293B" stroke-width="1.3" />
    <rect width="376" height="208" rx="16" fill="url(#topBlue)" />
    <rect x="24" y="0" width="90" height="3" rx="1.5" fill="url(#accent3)">
      <animate attributeName="width" values="70;140;70" dur="5.2s" repeatCount="indefinite" />
    </rect>

    <!-- Icon Badge -->
    <rect x="24" y="24" width="44" height="44" rx="12" fill="#0F172A" stroke="#0284C7" stroke-width="1" />
    <text x="46" y="53" text-anchor="middle" font-size="22">🗄️</text>

    <text x="82" y="44" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">Data &amp; Cloud</text>
    <text x="82" y="63" font-family="'Fira Code', Consolas, monospace" font-size="11" font-weight="600" fill="#38BDF8">SQL &amp; SERVERLESS CLOUD</text>

    <text x="24" y="102" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13.5" fill="#94A3B8">Normalized SQL database architecture and</text>
    <text x="24" y="122" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13.5" fill="#94A3B8">real-time serverless backends on Firebase.</text>

    <!-- Pills -->
    <g transform="translate(24, 152)" font-family="'Fira Code', Consolas, monospace" font-size="11.5" font-weight="600">
      <rect x="0" y="0" width="66" height="26" rx="7" fill="#0F172A" stroke="#1E3A8A" />
      <text x="33" y="17" text-anchor="middle" fill="#60A5FA">MySQL</text>

      <rect x="74" y="0" width="92" height="26" rx="7" fill="#0F172A" stroke="#1E3A8A" />
      <text x="120" y="17" text-anchor="middle" fill="#38BDF8">PostgreSQL</text>

      <rect x="174" y="0" width="84" height="26" rx="7" fill="#0F172A" stroke="#1E3A8A" />
      <text x="216" y="17" text-anchor="middle" fill="#93C5FD">Firebase</text>

      <rect x="266" y="0" width="54" height="26" rx="7" fill="#0F172A" stroke="#1E3A8A" />
      <text x="293" y="17" text-anchor="middle" fill="#CBD5E1">SQL</text>
    </g>
  </g>
</svg>
