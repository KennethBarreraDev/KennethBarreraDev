<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="cardFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0.96" />
    </linearGradient>

    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <radialGradient id="softGlow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#060913" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Container -->
  <rect x="4" y="4" width="1192" height="252" rx="20" fill="url(#pBg)" stroke="#1E293B" stroke-width="1.3" />
  <rect x="4" y="4" width="1192" height="252" rx="20" fill="url(#softGlow)" />

  <!-- Top Header Strip -->
  <g transform="translate(36, 30)">
    <circle cx="8" cy="10" r="4" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="22" y="14.5" font-family="'Fira Code', Consolas, monospace" font-size="12.5" font-weight="700" fill="#38BDF8" letter-spacing="1.6">ENGINEERING PROFILE</text>
    <text x="215" y="14.5" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13.5" fill="#94A3B8">End-to-end product engineering — from database schemas to fluid interfaces</text>
  </g>

  <!-- 2x2 Responsive-Ratio Glass Bento Grid -->
  <!-- CARD 1: Architecture -->
  <g transform="translate(32, 64)">
    <rect width="556" height="80" rx="14" fill="url(#cardFill)" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.7" />
    <rect x="0" y="16" width="3.5" height="48" rx="1.75" fill="#38BDF8" />
    <text x="24" y="33" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="15.5" font-weight="800" fill="#F8FAFC">🏗️  Architecture &amp; Ownership</text>
    <text x="24" y="57" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" fill="#94A3B8">Clean Architecture, SOLID principles &amp; modular systems built to scale cleanly.</text>
  </g>

  <!-- CARD 2: Performance -->
  <g transform="translate(612, 64)">
    <rect width="556" height="80" rx="14" fill="url(#cardFill)" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.7" />
    <rect x="0" y="16" width="3.5" height="48" rx="1.75" fill="#3B82F6" />
    <text x="24" y="33" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="15.5" font-weight="800" fill="#F8FAFC">⚡  Performance First</text>
    <text x="24" y="57" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="13" fill="#94A3B8">Smooth 60/120fps mobile rendering, tuned SQL queries &amp; real-time cloud sync.</text>
  </g>

  <!-- CARD 3: Full-Stack Mastery -->
  <g transform="translate(32, 158)">
    <rect width="556" height="80" rx="14" fill="url(#cardFill)" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.7" />
    <rect x="0" y="16" width="3.5" height="48" rx="1.75" fill="#60A5FA" />
    <text x="24" y="33" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="15.5" font-weight="800" fill="#F8FAFC">🌐  Production Stack</text>
    <text x="24" y="57" font-family="'Fira Code', Consolas, monospace" font-size="12.5" font-weight="600" fill="#BAE6FD">Flutter · Kotlin · React · Node.js · SQL · Firebase</text>
  </g>

  <!-- CARD 4: Next Frontiers -->
  <g transform="translate(612, 158)">
    <rect width="556" height="80" rx="14" fill="url(#cardFill)" stroke="#1E3A8A" stroke-width="1" stroke-opacity="0.7" />
    <rect x="0" y="16" width="3.5" height="48" rx="1.75" fill="#818CF8" />
    <text x="24" y="33" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="15.5" font-weight="800" fill="#F8FAFC">🌱  Expanding Into</text>
    <text x="24" y="57" font-family="'Fira Code', Consolas, monospace" font-size="12.5" font-weight="600" fill="#C7D2FE">Spring Boot (Java Microservices) · React Native</text>
  </g>

  <!-- Subtle Bottom Accent Bar -->
  <rect x="460" y="253" width="280" height="3" rx="1.5" fill="url(#accentBlue)" opacity="0.85" />
</svg>
